name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Service PostgreSQL exposé au job pour les tests d'intégration.
    # GitHub Actions démarre un container Postgres 16 à côté du runner
    # et attend qu'il soit healthy avant de lancer les steps.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itam_test_ci
        ports:
          - 5432:5432
        # Le healthcheck garantit que le service est prêt avant les steps
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables d'environnement disponibles pour TOUS les steps du job.
    # Les secrets JWT sont bidon (uniquement pour CI, jamais utilisés en prod).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/itam_test_ci?schema=public
      JWT_ACCESS_SECRET: ci-jwt-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: itam-api-dist-${{ github.sha }}
          path: dist/
          retention-days: 30